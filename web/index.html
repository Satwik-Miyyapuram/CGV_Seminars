<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GES-Explorer: Gaussian Meets Surfel</title>
    <!-- Modern Premium Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- KaTeX for beautiful math equations -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" onload="renderMathInElement(document.body, {delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}]});"></script>
    <link rel="stylesheet" href="./style.css" />
</head>
<body>
    <div id="tab-nav">
        <button class="tab-btn active" id="btn-viewer">GES Web Viewer</button>
        <button class="tab-btn" id="btn-comparison">Artifact Comparison</button>
    </div>

    <div id="viewer"></div>

    <!-- Collapsed shortcut chip (shown when the panel is hidden) -->
    <button id="ui-show" title="Show controls" aria-label="Show controls">☰ Controls</button>

    <div id="ui">
        <button id="ui-hide" title="Hide panel" aria-label="Hide panel">×</button>
        <h2>GES-Explorer</h2>
        <div class="subtitle">Interactive Paper Explainer</div>

        <div class="section-title"><span>■</span> Data Import <span class="status-badge" id="autoLoadStatus">Idle</span></div>

        <div class="control-group">
            <label>1. Scene (.ply) <span id="sceneLoaded" class="status-badge">Not Loaded</span></label>
            <label for="sceneInput" class="file-upload-btn" id="sceneLabel">Choose scene.ply...</label>
            <input type="file" id="sceneInput" accept=".ply">
        </div>

        <!-- Kept for status labels updated when a combined scene.ply is split -->
        <span id="surfelLabel" hidden></span><span id="surfelLoaded" hidden></span>
        <span id="gaussianLabel" hidden></span><span id="gaussianLoaded" hidden></span>

        <hr>

        <div class="section-title"><span>■</span> View Options</div>
        
        <label class="checkbox-container" style="display: none;">
            <input type="checkbox" id="toggleBiScale" checked>
            <span>Enable GES Bi-scale Disc Opacity (Eq. 6-7)</span>
        </label>
        
        <label class="checkbox-container">
            <input type="checkbox" id="toggleSurfels" checked>
            <span>Show Surfels (Module A)</span>
        </label>
        
        <label class="checkbox-container">
            <input type="checkbox" id="toggleGaussians" checked>
            <span>Show Gaussians (Module A)</span>
        </label>

        <hr>

        <div class="section-title"><span>■</span> Navigation Guide</div>
        <div style="font-size: 12px; color: var(--text-muted); line-height: 1.6; margin-top: 8px; font-family: 'Space Grotesk', sans-serif;">
            <div style="margin-bottom: 6px; display: flex; justify-content: space-between; gap: 10px;">
                <span style="color: var(--accent-blue); font-weight: 600;">Left Click + Drag</span>
                <span>Rotate</span>
            </div>
            <div style="margin-bottom: 6px; display: flex; justify-content: space-between; gap: 10px;">
                <span style="color: var(--accent-blue); font-weight: 600;">Right Click + Drag</span>
                <span>Pan</span>
            </div>
            <div style="margin-bottom: 6px; display: flex; justify-content: space-between; gap: 10px;">
                <span style="color: var(--accent-blue); font-weight: 600;">Scroll Wheel</span>
                <span>Zoom</span>
            </div>
        </div>
    </div>

    <!-- Comparison Tab UI — built by ComparisonTab.ts (see web/components/comparison) -->
    <div id="comparison-container"></div>

    <script type="module" src="./ges_viewer.ts"></script>
    <script type="module" src="./comparison_viewer.ts"></script>
    <script type="module" src="./combined_viewer.ts"></script>
</body>
</html>
