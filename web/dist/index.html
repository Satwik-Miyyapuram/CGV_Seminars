<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GES-Explorer: Gaussian Meets Surfel</title>
    <!-- Modern Premium Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- KaTeX for beautiful math equations -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" onload="renderMathInElement(document.body, {delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}]});"></script>
  <script type="module" crossorigin src="/assets/index-BzPM1Jyq.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-DilaqJLi.css">
</head>
<body>
    <div id="tab-nav">
        <button class="tab-btn active" id="btn-viewer">GES Web Viewer</button>
        <button class="tab-btn" id="btn-comparison">Artifact Comparison</button>
    </div>

    <div id="viewer"></div>
    <div id="ui">
        <h2>GES-Explorer</h2>
        <div class="subtitle">Interactive Paper Explainer</div>

        <div class="section-title"><span>■</span> Data Import <span class="status-badge" id="autoLoadStatus">Idle</span></div>
        
        <div class="control-group">
            <label>0. Combined Scene (.ply) <span id="sceneLoaded" class="status-badge">Not Loaded</span></label>
            <label for="sceneInput" class="file-upload-btn" id="sceneLabel">Choose Combined scene.ply...</label>
            <input type="file" id="sceneInput" accept=".ply">
        </div>

        <div class="control-group">
            <label>1. Surfels (.ply) <span id="surfelLoaded" class="status-badge">Not Loaded</span></label>
            <label for="surfelInput" class="file-upload-btn" id="surfelLabel">Choose Surfels File...</label>
            <input type="file" id="surfelInput" accept=".ply">
        </div>

        <div class="control-group">
            <label>2. Gaussians (.ply) <span id="gaussianLoaded" class="status-badge">Not Loaded</span></label>
            <label for="gaussianInput" class="file-upload-btn" id="gaussianLabel">Choose Gaussians File...</label>
            <input type="file" id="gaussianInput" accept=".ply" />
        </div>
        
        <div class="control-group">
            <label>3. Config (.json) <span id="configLoaded" class="status-badge">Not Loaded</span></label>
            <label for="configInput" class="file-upload-btn" id="configLabel">Choose Config File...</label>
            <input type="file" id="configInput" accept=".json" />
        </div>

        <hr>

        <div class="section-title"><span>■</span> Module E: Parameter Explorers</div>
        
        <div class="control-group">
            <label for="deltaSlider">
                Surfel Depth Offset (&delta;)
                <span class="slider-label-val" id="deltaValue">0.5</span>
            </label>
            <input type="range" id="deltaSlider" min="-10.0" max="50.0" step="0.1" value="0.5">
        </div>

        <div class="control-group" style="display: none;">
            <label for="opacityCapSlider">
                Interactive Opacity Cap (&tau;)
                <span class="slider-label-val" id="opacityCapValue">255.00</span>
            </label>
            <input type="range" id="opacityCapSlider" min="1.0" max="255.0" step="0.01" value="255.00">
        </div>

        <div class="control-group">
            <label for="discardThresholdSlider">
                Discard Threshold
                <span class="slider-label-val" id="discardThresholdValue">0.002</span>
            </label>
            <input type="range" id="discardThresholdSlider" min="0.0" max="0.1" step="0.001" value="0.002">
        </div>

        <hr>

        <div class="section-title"><span>■</span> View Options</div>
        
        <label class="checkbox-container" style="display: none;">
            <input type="checkbox" id="toggleBiScale" checked>
            <span>Enable GES Bi-scale Disc Opacity (Eq. 6-7)</span>
        </label>
        
        <label class="checkbox-container">
            <input type="checkbox" id="toggleSurfels" checked>
            <span>Show Surfels (Module A)</span>
        </label>
        
        <label class="checkbox-container">
            <input type="checkbox" id="toggleGaussians" checked>
            <span>Show Gaussians (Module A)</span>
        </label>
        
        <label class="checkbox-container">
            <input type="checkbox" id="toggleDepthTest" checked>
            <span>Enable Gaussian Depth Culling</span>
        </label>
    </div>

    <!-- Comparison Tab UI — built by ComparisonTab.ts (see web/components/comparison) -->
    <div id="comparison-container"></div>

</body>
</html>
